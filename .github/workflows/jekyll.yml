# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Set up job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: echo 'Starting build job'
  
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Jekyll build container
        uses: docker://ghcr.io/actions/jekyll-build-pages:v1.0.13

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: https://github.com/ttnntt213353/
          destination: youcoolbeans

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: youcoolbeans

      - name: Check build status
        id: status
        run: |
          echo "Workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Report result
        run: |
          if [ "${{ steps.status.outputs.status }}" = "success" ]; then
            echo "🟩 Build succeeded!"
          else
            echo "🟥 Build failed!"
          fi

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ https://github.com/ttnntt213353/youcoolbeans }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

